name: "Collective Agreement Assets"
description: "Copy collective agreement PDFs and generate document thumbnails."
inputs:
  github_token:
    description: "The GitHub token to use for deployment."
    required: true
  year:
    description: "The year the PDFs are for."
    required: true
outputs: {}
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - run: |
        sudo apt-get update
        sudo apt-get install -y ghostscript webp
      shell: bash


    - run: rm -f ./public/*.pdf ./public/*.webp
      shell: bash
      working-directory: ${{ github.action_path }}

    - run: bash ./scripts/publish-assets.sh "${{ github.workspace }}" "${{ github.action_path }}/public/"
      shell: bash
      working-directory: ${{ github.action_path }}

    - uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ${{ github.action_path }}/public
        force_orphan: true
